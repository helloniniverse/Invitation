
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Group | Digital Invitation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #07182d;
    font-family: 'Montserrat', sans-serif;
}

body {
    overflow: hidden;
}

button {
    font-family: inherit;
}

/* TRANSITION SCREENS */

.screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 1.2s ease, visibility 1.2s ease;
}

.screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    z-index: 2;
}


/* =====================================
   SCREEN 1 — PERFECTLY ALIGNED LAYERS
===================================== */

#opening {
  position: relative;
  overflow: hidden;
  background: #00142e;
}

#doorVideo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

/* Exact aspect ratio of door artwork */
.door-stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: max(100vw, 177.37dvh);
  aspect-ratio: 1646 / 928;
  transform: translate(-50%, -50%);
  z-index: 2;
  isolation: isolate;
}

/* EVERY IMAGE USES EXACTLY SAME CANVAS */
.door-layer {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
}

/* LAYER ORDER */

.door-base {
  z-index: 1;
}

.door-ribbon {
  z-index: 2;
  animation: ribbonLight 8s ease-in-out infinite;
}

.ribbon-light-sweep {
  z-index: 3;
  -webkit-mask-image: url("ribbon-overlay.png");
  mask-image: url("ribbon-overlay.png");
  animation: reflectedSweep 7.2s ease-in-out infinite;
}

.door-tails {
  z-index: 4;
  animation: tailsLight 7s ease-in-out infinite;
}

.tails-light-sweep {
  z-index: 5;
  -webkit-mask-image: url("seal-tails.png");
  mask-image: url("seal-tails.png");
  animation: reflectedSweep 6.4s ease-in-out 1.1s infinite;
}

.door-seal {
  z-index: 7;
  animation: sealLight 6s ease-in-out infinite, sealTremble 3.6s linear infinite;
}

.light-sweep {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(110deg,
    transparent 0 44%,
    rgba(255,239,184,.16) 47%,
    rgba(255,250,220,.94) 50%,
    rgba(255,192,72,.32) 53%,
    transparent 57% 100%);
  background-size: 260% 100%;
  background-position: 0 0;
  mix-blend-mode: screen;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
  mask-repeat: no-repeat;
  mask-size: 100% 100%;
}

@keyframes reflectedSweep {
  0%, 8% {
    background-position: 0 0;
    opacity: 0;
  }
  18% {
    opacity: .7;
  }
  62% {
    background-position: 100% 0;
    opacity: .62;
  }
  74%, 100% {
    background-position: 100% 0;
    opacity: 0;
  }
}

/* RIBBON SHIMMER */

@keyframes ribbonLight {
  0%, 100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.14)
      drop-shadow(0 0 4px rgba(255,200,90,.25));
  }
}

/* TAILS SHIMMER */

@keyframes tailsLight {
  0%, 100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.12);
  }
}

/* SEAL METALLIC SHINE */

@keyframes sealLight {
  0%, 100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.16)
      drop-shadow(0 0 8px rgba(255,195,75,.3));
  }
}

@keyframes sealTremble {
  0%, 72%, 100% {
    transform: translate(0, 0) rotate(0);
  }
  74% {
    transform: translate(-.8px, .3px) rotate(-.08deg);
  }
  75% {
    transform: translate(1px, -.4px) rotate(.1deg);
  }
  76% {
    transform: translate(-.9px, .4px) rotate(-.08deg);
  }
  77% {
    transform: translate(.6px, -.2px) rotate(.06deg);
  }
  79% {
    transform: translate(0, 0) rotate(0);
  }
}

/* GOLDEN ORB — BEHIND THE SEAL */

.seal-orb {
  position: absolute;
  left: 50%;
  top: 52.7%;
  width: 24%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%) scale(.8);
  border-radius: 50%;
  z-index: 6;

  opacity: .18;
  pointer-events: none;
  animation: sealOrbFlicker 3.2s ease-in-out infinite;

  background: radial-gradient(
    circle,
    rgba(255,233,160,.8) 0%,
    rgba(255,195,70,.5) 28%,
    rgba(255,165,40,.18) 52%,
    transparent 75%
  );

  filter: blur(15px);

  transition:
    opacity .5s ease,
    transform .6s ease;
}

@keyframes sealOrbFlicker {
  0%, 100% { opacity: .12; transform: translate(-50%, -50%) scale(.8); }
  8% { opacity: .54; transform: translate(-50%, -50%) scale(.96); }
  11% { opacity: .2; transform: translate(-50%, -50%) scale(.84); }
  15% { opacity: .72; transform: translate(-50%, -50%) scale(1.02); }
  19% { opacity: .14; transform: translate(-50%, -50%) scale(.8); }
  25% { opacity: .025; transform: translate(-50%, -50%) scale(.72); }
  29% { opacity: .12; transform: translate(-50%, -50%) scale(.82); }
  41% { opacity: .34; transform: translate(-50%, -50%) scale(.91); }
  46% { opacity: .055; transform: translate(-50%, -50%) scale(.76); }
  50% { opacity: .025; transform: translate(-50%, -50%) scale(.72); }
  56% { opacity: .58; transform: translate(-50%, -50%) scale(.98); }
  60% { opacity: .16; transform: translate(-50%, -50%) scale(.82); }
  69% { opacity: .035; transform: translate(-50%, -50%) scale(.74); }
  74% { opacity: .1; transform: translate(-50%, -50%) scale(.8); }
  84% { opacity: .48; transform: translate(-50%, -50%) scale(.94); }
  90% { opacity: .14; transform: translate(-50%, -50%) scale(.81); }
  96% { opacity: .3; transform: translate(-50%, -50%) scale(.88); }
}

/* CLICKABLE AREA */

.seal-button {
  position: absolute;
  left: 50%;
  top: 52.7%;
  width: 17.5%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  z-index: 8;

  border: 0;
  padding: 0;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
}

/* HOVER: ORB APPEARS */

@media (hover: hover) {
  .seal-button:hover ~ .open-hint {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .door-stage:has(.seal-button:hover) .seal-orb {
    animation: none;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }

  .door-stage:has(.seal-button:hover) .door-seal {
    animation: none;
    filter: brightness(1.2)
      drop-shadow(0 0 12px rgba(255,195,75,.55));
  }
}

/* TAP INSTRUCTION */

.open-hint {
  position: absolute;
  left: 50%;
  top: 76%;
  transform: translate(-50%, 8px);
  z-index: 9;

  margin: 0;
  color: #f5d79d;
  font-size: clamp(8px, .85vw, 12px);
  letter-spacing: 3px;
  white-space: nowrap;
  text-align: center;
  text-shadow: 0 2px 8px rgba(0,0,0,.75);

  opacity: 0;
  pointer-events: none;

  transition:
    opacity .5s ease,
    transform .5s ease;
}

@media (hover: none) {
  .open-hint {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

/* VIDEO PLAYING — HIDE ALL LAYERS */

#opening.playing .door-stage {
  opacity: 0;
  pointer-events: none;
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  .light-sweep,
  .door-ribbon,
  .door-tails,
  .door-seal,
  .seal-orb {
    animation: none !important;
  }
}


/* =================================
   SCREEN 3: TEXT INVITATION
================================= */

#finalScreen {
    background: #fff;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 25px 15px;
    align-items: center;
}

.invitation-card {
    position: relative;
    width: 100%;
    max-width: 540px;
    min-height: min(720px, 95vh);
    padding: 65px 35px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #fff;
    animation: reveal 1.5s ease;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.ornament {
    position: absolute;
    inset: 12px;
    border: 1px solid #e9dfd4;
    pointer-events: none;
}

.ornament::before,
.ornament::after {
    content: "❧";
    position: absolute;
    color: #d9c6ae;
    font-size: 35px;
}

.ornament::before {
    top: 0;
    left: 8px;
}

.ornament::after {
    bottom: 0;
    right: 8px;
    transform: rotate(180deg);
}

.invite-brand {
    font-size: 11px;
    letter-spacing: 5px;
    color: #c59b54;
    margin-bottom: 12px;
}

.invite-label {
    font-size: 9px;
    letter-spacing: 4px;
    color: #bcae9e;
    margin-bottom: 30px;
}

.invitation-card h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 9vw, 76px);
    font-weight: 300;
    line-height: .95;
    color: #c69c51;
    text-transform: uppercase;
}

.invitation-card h1 span {
    display: block;
}

.gold-divider {
    width: 65px;
    height: 1px;
    background: #c69c51;
    margin: 30px auto;
}

.invite-message {
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    line-height: 1.7;
    color: #827567;
    max-width: 350px;
}

.event-info {
    margin-top: 30px;
    color: #98784c;
}

.event-info p {
    font-size: 10px;
    letter-spacing: 3px;
    margin: 12px 0;
}

.event-info strong {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 1px;
}

.rsvp-button {
    margin-top: 30px;
    padding: 15px 30px;
    background: #bd914b;
    border: none;
    color: white;
    font-size: 10px;
    letter-spacing: 3px;
    cursor: pointer;
}

.rsvp-button:hover {
    background: #8c6734;
}


/* ===================================
   ORNAMENT FRAME — FLOAT + REFLECTION
   =================================== */

#introScreen .intro-frame {
  animation:
    ornamentFloat 7s ease-in-out infinite,
    ornamentGlow 9s ease-in-out infinite;

  will-change: transform;
}

/* Gentle up-and-down movement */
@keyframes ornamentFloat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-6px);
  }
}

/* Subtle porcelain reflection */
@keyframes ornamentGlow {
  0%, 100% {
    filter: brightness(1);
  }

  50% {
    filter: brightness(1.07)
            drop-shadow(0 0 5px rgba(220,210,195,0.2));
  }
}

/* Softer movement on mobile */
@media (max-width: 600px) {
  #introScreen .intro-frame {
    animation:
      ornamentFloatMobile 7s ease-in-out infinite,
      ornamentGlow 9s ease-in-out infinite;
  }

  @keyframes ornamentFloatMobile {
    0%, 100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-3px);
    }
  }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
  #introScreen .intro-frame {
    animation: none;
  }
}


/* =================================
   SCREEN 4: RSVP
================================= */

#rsvpScreen {
    background: #fff;
    overflow-y: auto;
    padding: 25px 15px;
}

.rsvp-card {
    width: 100%;
    max-width: 450px;
    padding: 45px 30px;
    background: #fffdf9;
    border: 1px solid #e7d9c6;
    text-align: center;
}

.rsvp-card h2 {
    font: 40px 'Cormorant Garamond', serif;
    color: #b78c4b;
    margin: 20px 0;
}

.rsvp-card p {
    font: 16px 'Cormorant Garamond', serif;
    color: #887766;
    margin-bottom: 25px;
}

.rsvp-card input,
.rsvp-card select {
    width: 100%;
    padding: 15px;
    margin-bottom: 13px;
    border: 1px solid #e5d8c8;
    background: white;
    font-family: inherit;
    font-size: 13px;
}

.rsvp-card button {
    width: 100%;
    padding: 16px;
    border: none;
    background: #b78c4b;
    color: white;
    letter-spacing: 3px;
    cursor: pointer;
}

.confirmation {
    display: none;
    padding: 25px;
    color: #8c704b;
    line-height: 1.8;
}

/* =================================
   MOBILE RESPONSIVENESS
================================= */

@media (max-width: 600px) {

    .seal-button {
        width: min(34vw, 23vh);
    }

    .open-hint {
        top: 76%;
        letter-spacing: 2px;
    }

    #doorVideo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }

    #finalScreen {
        padding: 15px 10px;
        align-items: flex-start;
    }

    .invitation-card {
        min-height: auto;
        padding: 65px 22px;
        margin: auto 0;
    }

    .invitation-card h1 {
        font-size: clamp(45px, 12vw, 65px);
    }

    .invite-message {
        font-size: 19px;
    }

    .event-info strong {
        font-size: 20px;
    }

    .rsvp-button {
        max-width: 100%;
        line-height: 1.5;
    }

    .skip-button {
        right: 15px;
        bottom: max(15px, env(safe-area-inset-bottom));
    }
}

@media (max-height: 600px) and (orientation: landscape) {

    #finalScreen {
        align-items: flex-start;
    }

    .invitation-card {
        min-height: auto;
        padding: 40px 25px;
        margin: auto;
    }

}


/* =====================================
   POST-VIDEO ORNATE INTRO
   JP GROUP — ELEGANT ANIMATIONS
===================================== */

#introScreen {
  background: #fff;
  overflow: hidden;
  padding: 18px;
}

.intro-center {
  position: relative;
  width: min(92vw, 420px);
  height: min(86dvh, 620px);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ORNAMENTAL FRAME */

.intro-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;

  filter: drop-shadow(
    0 2px 5px rgba(90,78,67,.13)
  );

  opacity: 0;
  transform: scale(.93);

  transition:
    opacity 1.2s ease,
    transform 1.5s ease;
}

#introScreen.active .intro-frame {
  opacity: 1;
  transform: scale(1);
}

/* Floating starts after frame entrance */
#introScreen.animate .intro-frame {
  animation: ornamentFloat 7s ease-in-out
             1.5s infinite;
}

@keyframes ornamentFloat {
  0%, 100% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-5px) scale(1);
  }
}

/* TEXT CONTAINER */

.intro-copy {
  position: relative;
  z-index: 1;
  width: 60%;
  text-align: center;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 10px;
  padding-top: 1%;
}

/* ORIGINAL SEQUENTIAL TEXT REVEAL */

.intro-copy > * {
  opacity: 0;
  transform: translateY(14px);

  transition:
    opacity .8s ease,
    transform .9s cubic-bezier(.2,.7,.2,1);
}

#introScreen.animate .intro-copy > * {
  opacity: 1;
  transform: translateY(0);
}

#introScreen.animate
.intro-copy > :nth-child(1) {
  transition-delay: .5s;
}

#introScreen.animate
.intro-copy > :nth-child(2) {
  transition-delay: 1s;
}

#introScreen.animate
.intro-copy > :nth-child(3) {
  transition-delay: 1.55s;
}

#introScreen.animate
.intro-copy > :nth-child(4) {
  transition-delay: 2.15s;
}

#introScreen.animate
.intro-copy > :nth-child(5) {
  transition-delay: 2.65s;
}

/* JP GROUP */

.intro-brand {
  color: #c99b51;
  font-size: clamp(9px,1.1vw,11px);
  letter-spacing: 2px;
}

/* CORDIALLY INVITES */

.intro-sub {
  color: #c9b8a1;
  font-size: clamp(7px,.9vw,9px);
  letter-spacing: 1.3px;
}

/* NICOLE MERCADO */

.intro-name {
  font: 300 clamp(28px,4.5vw,47px)/.9
        'Cormorant Garamond', serif;

  text-transform: uppercase;
  margin: 8px 0 12px;
}

/* Metallic reflection on name */

.intro-name span {
  display: block;

  color: #c99745;

  background: linear-gradient(
    110deg,
    #b78335 0%,
    #c99745 30%,
    #f9e5b5 46%,
    #fff6db 50%,
    #d6a657 55%,
    #b78335 75%,
    #c99745 100%
  );

  background-size: 250% 100%;
  background-position: 100% center;

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Reflection begins after name reveal */

#introScreen.animate .intro-name span {
  animation: goldReflection
             9s ease-in-out 3s infinite;
}

@keyframes goldReflection {
  0%, 20% {
    background-position: 100% center;
  }

  60%, 100% {
    background-position: 0% center;
  }
}

/* JOIN THE CELEBRATION */

.intro-join {
  color: #c99745;
  font-size: clamp(8px,1vw,10px);
  letter-spacing: 1.3px;
}

/* TAP TO KNOW MORE */

.intro-next {
  border: 0;
  background: transparent;
  color: #b99c70;

  font-size: 9px;
  letter-spacing: 2px;
  cursor: pointer;
  padding: 10px;
}

/* Button glow after text appears */

#introScreen.animate .intro-next {
  animation: tapGlow
             4s ease-in-out 3.5s infinite;
}

@keyframes tapGlow {
  0%, 100% {
    color: #b99c70;
    text-shadow: none;
  }

  50% {
    color: #c99745;
    text-shadow:
      0 0 6px rgba(201,151,69,.35);
  }
}

.intro-next:hover {
  color: #b78335;
  text-shadow:
    0 0 8px rgba(201,151,69,.45);
}

/* MOBILE RESPONSIVENESS */

@media (max-width: 600px) {

  .intro-center {
    width: min(96vw,430px);
    height: min(78dvh,650px);
  }

  .intro-copy {
    width: 59%;
    gap: 8px;
  }

  .intro-name {
    font-size: clamp(29px,9vw,44px);
    margin: 7px 0 10px;
  }

  .intro-brand {
    font-size: 9px;
  }

  .intro-sub {
    font-size: 7px;
  }

  .intro-join {
    font-size: 8px;
  }
}

/* SHORT LANDSCAPE SCREENS */

@media (max-height: 520px) {

  .intro-center {
    height: 94dvh;
    width: min(55vw,400px);
  }

  .intro-name {
    font-size: 28px;
  }

  .intro-copy {
    gap: 3px;
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {

  .intro-copy > *,
  .intro-frame {
    transition-duration: .01ms !important;
    transition-delay: 0ms !important;
  }

  #introScreen .intro-frame,
  #introScreen .intro-name span,
  #introScreen .intro-next {
    animation: none !important;
  }

  #introScreen .intro-name span {
    background: none;
    -webkit-text-fill-color: #c99745;
  }


/* =====================================
   CINEMATIC DOOR SHAKE EFFECT
===================================== */

/* Apply shake to the video only */
#opening.video-shake #doorVideo {
    animation: cinematicDoorShake 1.15s
               cubic-bezier(.36,.07,.19,.97) both;
    transform-origin: center center;
    will-change: transform;
}

@keyframes cinematicDoorShake {

    0% {
        transform: translate(0, 0) scale(1.025);
    }

    10% {
        transform: translate(-7px, 3px) scale(1.035);
    }

    20% {
        transform: translate(8px, -4px) scale(1.035);
    }

    30% {
        transform: translate(-10px, 5px) scale(1.04);
    }

    40% {
        transform: translate(9px, -5px) scale(1.04);
    }

    50% {
        transform: translate(-7px, 4px) scale(1.035);
    }

    60% {
        transform: translate(6px, -3px) scale(1.03);
    }

    75% {
        transform: translate(-3px, 2px) scale(1.025);
    }

    90% {
        transform: translate(2px, -1px) scale(1.015);
    }

    100% {
        transform: translate(0, 0) scale(1);
    }
}


@media(max-height:520px) { .intro-center { height:94dvh; width:min(55vw,400px); } .intro-name {font-size:28px;} .intro-copy{gap:3px;} }
@media(prefers-reduced-motion:reduce) { .intro-copy > *, .intro-frame { transition-duration:.01ms !important; transition-delay:0ms !important; } }

</style>
</head>

<body>



<!-- SCREEN 1: ANIMATED DOOR -->
<section class="screen active" id="opening">

  <video
    id="doorVideo"
    playsinline
    webkit-playsinline
    preload="auto"
    aria-label="JP Group doors opening"
  >
    <source
      id="doorVideoSource"
      src="door-opening-desktop.mp4"
      type="video/mp4"
    >
  </video>

  <div class="door-stage" id="doorStage">

    <!-- All images have identical canvas dimensions -->
    <img class="door-layer door-base"
         src="door-cover.png" alt="">

    <img class="door-layer door-ribbon"
         src="ribbon-overlay.png" alt="">
        <div class="light-sweep ribbon-light-sweep" aria-hidden="true"></div>

    <img class="door-layer door-tails"
         src="seal-tails.png" alt="">
        <div class="light-sweep tails-light-sweep" aria-hidden="true"></div>

    <!-- Golden orb behind the seal -->
    <div class="seal-orb"></div>

    <img class="door-layer door-seal"
         src="seal-overlay.png" alt="">

    <!-- Invisible clickable area over seal -->
    <button
      class="seal-button"
      id="sealButton"
      type="button"
      aria-label="Tap the seal to open invitation"
    ></button>

    <p class="open-hint">TAP THE SEAL TO OPEN</p>

  </div>

  <button
    class="skip-button"
    id="skipButton"
    type="button"
    style="display:none"
  >
    SKIP INTRO
  </button>

</section>



<!-- SCREEN 2: ANIMATED ORNATE INTRO AFTER VIDEO -->
<section class="screen" id="introScreen" aria-label="Personal invitation introduction">
  <div class="intro-center">
    <img class="intro-frame" src="ornate-frame.png" alt="" aria-hidden="true">
    <div class="intro-copy">
      <p class="intro-brand">JP GROUP</p>
      <p class="intro-sub">CORDIALLY INVITES</p>
      <h1 class="intro-name"><span>Nicole</span><span>Mercado</span></h1>
      <p class="intro-join">JOIN THE CELEBRATION</p>
      <button class="intro-next" id="introNext" type="button">TAP TO KNOW MORE</button>
    </div>
  </div>
</section>

<script>
const CANVA_URL = "https://jcrapsing.my.canva.site/wedding-website-template-website-in-black-and-white-beige-scrapbook-style/";
const opening = document.getElementById("opening");
const introScreen = document.getElementById("introScreen");
const doorVideo = document.getElementById("doorVideo");
const doorVideoSource = document.getElementById("doorVideoSource");
const sealButton = document.getElementById("sealButton");
const skipButton = document.getElementById("skipButton");
const mobileVideoQuery = window.matchMedia("(max-width: 600px) and (orientation: portrait)");
let started = false;
let finished = false;

function selectVideo() {
  if (started) return;
  const file = mobileVideoQuery.matches
    ? "door-opening-mobile.mp4"
    : "door-opening-desktop.mp4";
  if (doorVideoSource.getAttribute("src") !== file) {
    doorVideoSource.setAttribute("src", file);
    doorVideo.load();
  }
}
selectVideo();
if (mobileVideoQuery.addEventListener) {
  mobileVideoQuery.addEventListener("change", selectVideo);
}

function revealOrnamentalIntro() {
  if (finished) return;
  finished = true;
  doorVideo.pause();
  opening.classList.remove("active");
  introScreen.classList.add("active");
  requestAnimationFrame(() => {
    requestAnimationFrame(() => introScreen.classList.add("animate"));
  });
}

sealButton.addEventListener("click", () => {
  if (started) return;
  started = true;
  sealButton.disabled = true;
  const playPromise = doorVideo.play();
  if (playPromise && typeof playPromise.then === "function") {
    playPromise.then(() => (opening.classList.add("playing"), skipButton.style.display = "block"))
      .catch((error) => {
        console.error("Door video failed to play:", error);
        started = false;
        sealButton.disabled = false;
        skipButton.style.display = "block";
      });
  } else {
    opening.classList.add("playing");
    skipButton.style.display = "block";
  }
});

doorVideo.addEventListener("ended", revealOrnamentalIntro);
doorVideo.addEventListener("error", () => {
  console.error("Video unavailable. Confirm MP4 filename and encoding.");
  skipButton.style.display = "block";
});
skipButton.addEventListener("click", revealOrnamentalIntro);

// The exact text INSIDE the white ornamental frame links to Canva.
document.getElementById("introNext").addEventListener("click", () => {
  window.location.assign(CANVA_URL);
});
</script>
</body>
</html>
